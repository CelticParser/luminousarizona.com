[build]
	publish = "public"
	command = "npm run build"

# Draft pages (`published: false`): included when Netlify CONTEXT is not `production` and BRANCH is `stage`
# (see eleventy.config.js). Build log will still show `ELEVENTY_PRODUCTION=true eleventy` from npm — that is expected.
# Optional override for another branch name: set ELEVENTY_DRAFTS=true in the Netlify UI for that branch.